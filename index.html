<!DOCTYPE html>
<html lang="ur" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProJoin - Secure Gplinks Coin Rewards</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0a0a0c',
                        cardBg: '#121218',
                        cardBorder: '#272735',
                        neonPink: '#ff2a85',
                        neonPurple: '#b829ff',
                        neonCyan: '#00f2fe'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0c;
            color: #f3f4f6;
        }
        .text-gradient {
            background: linear-gradient(135deg, #ff2a85 0%, #b829ff 50%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .bg-gradient-pink {
            background: linear-gradient(135deg, #ff2a85 0%, #b829ff 100%);
        }
        .glass-card {
            background: rgba(18, 18, 24, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 42, 133, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .neon-glow {
            box-shadow: 0 0 25px rgba(255, 42, 133, 0.25);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-neonPink selection:text-white">

    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getDatabase, ref, get, child, update, push } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBAjO52-ZVb6jKurqJREtMo7PrRdmRf6is",
            authDomain: "projoin-b2d3c.firebaseapp.com",
            databaseURL: "https://projoin-b2d3c-default-rtdb.firebaseio.com",
            projectId: "projoin-b2d3c",
            storageBucket: "projoin-b2d3c.firebasestorage.app",
            messagingSenderId: "886679815440",
            appId: "1:886679815440:web:279c6b93e3bd38bacc1195",
            measurementId: "G-5Z0FKF3CZL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.db = db;
        window.firebaseRefs = { ref, get, child, update, push };
    </script>

    <!-- Header Navigation -->
    <header class="glass-card sticky top-0 z-30 border-b border-cardBorder px-4 lg:px-8 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-pink flex items-center justify-center text-white font-black text-lg shadow-md shadow-neonPink/40">
                <i class="fa-solid fa-coins"></i>
            </div>
            <div>
                <span class="text-xl font-black tracking-tight">PROJOIN <span class="text-gradient">REWARDS</span></span>
                <p class="text-[11px] opacity-70">Rewards System Status</p>
            </div>
        </div>
        <div>
            <span class="px-3 py-1 rounded-full text-xs font-extrabold bg-red-500/10 text-red-400 border border-red-400/30 font-mono">
                <i class="fa-solid fa-ban mr-1"></i> System Disabled
            </span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-xl w-full mx-auto p-4 lg:p-6 flex flex-col justify-center">
        
        <!-- Disabled Notice Card -->
        <div class="glass-card rounded-3xl p-6 lg:p-8 neon-glow border-cardBorder text-center space-y-6">
            <div class="w-16 h-16 rounded-2xl bg-red-500/20 text-red-500 flex items-center justify-center text-3xl mx-auto border border-red-500/30">
                <i class="fa-solid fa-triangle-exclamation animate-pulse"></i>
            </div>
            <div class="space-y-2">
                <h2 class="text-2xl font-black text-white">Claim System Temporarily Closed</h2>
                <p class="text-xs text-gray-400 leading-relaxed">
                    Filhal rewards claim karne ka system disable kar diya gaya hai. Mazeed maloomat ke liye admin se rabta karein.
                </p>
            </div>

            <div class="p-4 rounded-2xl bg-black/40 border border-cardBorder text-xs text-gray-400 font-mono">
                Status: <span class="text-red-400 font-bold">Offline / Disabled</span>
            </div>
        </div>

    </main>

    <!-- Custom Notification Toast -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs opacity-50 border-t border-cardBorder">
        © 2026 ProJoin Rewards Hub. All Rights Reserved.
    </footer>

    <!-- Logic Script -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            showToast("Rewards Claim System is currently disabled.", "error");
        });

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `glass-card px-4 py-3 rounded-2xl shadow-2xl text-xs font-semibold flex items-center space-x-2 border ${type === 'success' ? 'border-emerald-500/40 text-emerald-400' : 'border-red-500/40 text-red-400'} pointer-events-auto transition transform translate-y-2 opacity-0`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-triangle-exclamation'}"></i><span>${message}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
